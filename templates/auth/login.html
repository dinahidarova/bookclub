{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="mb-3">Вход в систему</h3>
                {% if form.errors %}
                    <div class="alert alert-danger">Неверное имя пользователя или пароль.</div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn btn-dark w-100" type="submit">Войти</button>
                </form>
                <p class="mt-3 text-center">Нет аккаунта? Обратитесь к администратору.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
